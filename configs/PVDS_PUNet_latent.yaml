data:
  data_dir: /mnt/zone/A/P2B_latent_DDPM/data
  dataset: PUNet
  augment: true
  use_rgb_features: false
  workers: 4
  npoints: 2048
  resolutions: ["10000_poisson", "30000_poisson", "50000_poisson"]
  test_resolutions: ["10000_poisson", "30000_poisson", "50000_poisson"]
diffusion:
  bridge_type: otcfm
  timesteps: 1000
  sampling_timesteps: 10
  objective: pred_noise
  schedule: linear
  sampling_strategy: DDPM
  loss_type: mse
  beta_start: 1.e-4
  beta_end: 0.02
  t0: 1.e-4
  T: 1.0
  ot_ode: true
  ot_reg: 0.14
  latent_loss_weight: 0.3
model:
  type: PVD
  model_type: latent_otcfm
  ema: true
  in_dim: 3
  extra_feature_channels: 0
  out_dim: 3
  time_embed_dim: 64
  dropout: 0.15
  # ---- Autoencoder ----
  ae_ckpt: /mnt/zone/B/NEW/P2B_latent_DDPM/checkpoints_ae_retrain_v3/ae_epoch_675.pth
  feat_dim: 512
  ae_num_tokens: 64
  use_dino: false
  use_offset_attn: true
  # ---- FreqEncodingTransformer ----
  freq_num_freqs: 6
  freq_num_layers: 4
  freq_num_heads: 8
  freq_ff_mult: 4
  freq_dropout: 0.1
  freq_out_dim: 512
  freq_learnable: true
  EMA:
    decay: 0.999
  PVD:
    use_global_embedding: false
    global_embedding_dim: 1024
    feat_embed_dim: 32
    attention_type: linear
    attention_heads: 4
    film_cond_dim: 512
    latent_film: true
    latent_num_heads: 8
    fp_write_attn: true
    size: large
    attentions:
    - 0
    - 0
    - 0
    - 1
    channels:
    - 32
    - 64
    - 128
    - 256
    - 512
    voxel_resolutions:
    - 32
    - 16
    - 8
    - 8
    n_sa_blocks:
    - 1
    - 2
    - 1
    - 1
    n_fp_blocks:
    - 1
    - 2
    - 1
    - 1
    radius:
    - 0.1
    - 0.2
    - 0.4
    - 0.8
    out_mlp: 128
training:
  optimizer:
    type: AdamW
    lr: 3.e-4
    beta1: 0.9
    beta2: 0.999
    weight_decay: 1.0e-05
    freq_transformer_lr_mult: 3.0
    write_attn_lr_mult: 3.0
  scheduler:
    type: constant
    warmup_steps: 0
    cosine_start_step: 50000
  grad_clip:
    enabled: true
    value: 1.0
  bs: 32
  overfit: false
  amp: true
  steps: 450_000
  accumulation_steps: 1
  log_interval: 10
  save_interval: 25000
  viz_interval: 100
  seed: 42
sampling:
  bs: 32
  num_iter: 8
  accum_iter: 16
use_ema: true
