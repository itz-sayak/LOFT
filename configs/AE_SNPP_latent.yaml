# GeomTokenAE training on real ScanNet++ (NPZ batches)
# Run from P2P-Bridge-OT-real-latent/:
#   python scripts/train_autoencoder.py --config configs/AE_SNPP_latent.yaml

data:
  data_dir: "/mnt/zone/A/P2B_latent_DDPM/snpp_real_processed"
  dataset: ScanNetPP
  augment: true
  use_rgb_features: false
  workers: 4
  npoints: 4096
  train_split_path: "splits/snpp_real_train.txt"
  val_split_path: "splits/snpp_real_val.txt"

model:
  model_type: geom_token_ae
  in_dim: 3
  feat_dim: 512
  use_dino: false
  dino_dim: 384
  sem_dim: 128
  use_cross_attn: true
  use_offset_attn: true

training:
  bs: 16
  epochs: 2000
  save_interval: 50
  ckpt_dir: "/mnt/zone/A/P2P-Bridge-OT-real-latent/checkpoints_ae_snpp"
  save_best_only: true
  best_metric: "clean_cd"
  resume_from: ""
  start_epoch: 0
  clean_weight: 1.0
  denoise_weight: 1.0
  l1_weight: 0.1
  latent_consistency_weight: 0.05
  latent_l2_weight: 1.0e-4
  grad_clip:
    value: 1.0
  optimizer:
    type: AdamW
    lr: 2.0e-4
    beta1: 0.9
    beta2: 0.999
    weight_decay: 1.0e-4
  scheduler:
    type: cosine
    min_lr: 1.0e-6

distribution_type: single
local_rank: 0
